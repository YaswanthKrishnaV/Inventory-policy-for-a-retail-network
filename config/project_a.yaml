# Project A — every assumption lives here so it can be changed live.
# Day indices follow M5: d_1 = 2011-01-29. Arrays in code are 0-based: index = d - 1.

paths:
  data_dir: data            # sales_train_evaluation.csv, sell_prices.csv, calendar.csv
  cache_dir: cache          # derived arrays (gitignored)
  out_dir: project_a        # forecasts.parquet etc.
  reports_dir: reports

scope:
  state: CA
  category: FOODS
  departments: [FOODS_1, FOODS_2, FOODS_3]
  stores: [CA_1, CA_2, CA_3, CA_4]

calendar:
  default_cutoff: 1885      # last day of training data (d_1885); test = cutoff+1 ...
  test_days: 56
  last_data_day: 1941       # sales exist through d_1941
  forecast_horizon: 28      # brief asks for 28-day-ahead quantiles
  refit_every: 28           # re-forecast inside the replay every N days (decision §13.5)
  backtest_cutoffs: [1801, 1829, 1857]   # used by `python -m project_a.backtest` with no args
  backtest_offsets: [84, 56, 28]        # end-to-end run: forecast backtests at cutoff - offset (28-day windows end <= cutoff)
  tuning_offsets: [56, 84, 112]         # policy knobs tuned on 56-day replays at cutoff - offset (end <= cutoff)

costs:
  holding_rate_annual: 0.25 # x selling price per unit-year
  lost_sale_rate: 0.35      # x selling price per unit of unmet demand
  po_fixed: 50.0            # $ per department per purchase order
  transfer_per_unit: 0.05   # $ per unit DC -> store
  hold_in_transit: false    # decision §13.3: holding charged on on-hand only

lead_times:
  supplier_mean_days: {FOODS_1: 5, FOODS_2: 7, FOODS_3: 10}
  supplier_cv: 0.4          # lognormal; sigma^2 = ln(1+cv^2)
  dc_to_store_days: 2
  dc_order_weekday: Monday  # DC places POs only on this weekday

capacity:
  dc_outbound_multiple: 1.25    # x avg daily CA FOODS sales
  dc_outbound_window_days: 365  # last N training days for that average
  store_cap_days: 21            # store on-hand+inbound <= N x item avg daily sales (decision §13.4)
  initial_stock_days: 7         # every location incl. DC starts with N days (decision §13.2)
  avg_sales_window_days: 365    # "average daily sales" (store cap, initial stock) = mean over last N training days
  avg_sales_basis: recorded     # recorded | recovered — brief says "sales"; recorded is the literal reading (D-20)
  initial_pipeline: false

fill_rate:
  target: 0.95
  definition: network_units     # units sold / units demanded, all stores x items x days (decision §13.1)

recovery:
  # zero-run stockout detector (see src/demand_recovery.py)
  neighbour_window_days: 56     # days either side of a zero run used to estimate the local rate
  min_neighbour_days: 14        # fewer clean neighbour days -> can't judge, leave as genuine zero
  p_threshold: 0.001            # flag run if P(run of zeros | local NB rate) < this (tuned: injection + null tests)
  passes: 2                     # re-estimate local rates excluding flagged runs
  dormant_days: 56             # zero run this long = not replenished for months -> treat as not ranged
  dispersion_clip: [0.5, 50.0]  # NB size parameter r bounds
  store_disruption_ratio: 0.5   # store-day total < ratio x local expected -> store-wide disruption
  closed_ratio: 0.05            # store-day total < ratio x expected -> store closed
  injection:
    n_per_band: 400             # synthetic stockouts injected per velocity band
    lengths: [1, 3, 7, 14]
    seed: 7

prices:
  use_future_prices: false      # decision §13.6: carry forward last known price after cutoff

forecast:
  backend: sklearn              # sklearn (HistGradientBoosting) | lightgbm — same Poisson GBM; see DECISION_LOG D-19
  train_days: 728               # target days used for training (2 years)
  subsample: 0.5                # row subsample for speed (0.5 of ~3.2M rows; checked vs 1.0 in DECISION_LOG)
  params: {learning_rate: 0.06, max_iter: 400, max_leaf_nodes: 127, min_samples_leaf: 200, l2: 1.0}
  quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  n_paths: 500                  # sample paths per series (DC paths = sums of store paths)
  dispersion_bins: [0, 0.1, 0.25, 0.5, 1, 2, 4, 8, 16, 1.0e9]   # daily-mean bands for NB 1/r
  item_bins: [0, 10, 30, 100, 300, 1000, 1.0e9]                  # 28-day item network volume bands for s_p^2
  adjust:                       # post-model corrections measured on the out-of-sample calibration window (D-24)
    level_shrink: 0.5           # apply half of the store x dept actual/forecast ratio
    level_clip: [0.85, 1.2]
    dormant_resume: true        # dormant-at-origin items forecast at pre-dormancy rate x empirical resume factor

policy:
  extend_days: 56               # forecast means extended by weekday pattern beyond 28 days (DC protection interval)
  n_paths_dc: 200               # coherent DC sample paths used for echelon targets
  knobs:                        # tuned on backtest cutoffs (project_a/tune.py); defaults here
    alpha_store: {FOODS_1: 0.97, FOODS_2: 0.97, FOODS_3: 0.97}
    beta_dc: {FOODS_1: 0.97, FOODS_2: 0.97, FOODS_3: 0.97}
    store_window: 3             # days of demand the store position must cover after today's order
    prebuild: true              # pre-ship ahead of days where the DC outbound cap would bind
    lookahead_days: 6
    cap_eta: 0.97               # plan to use at most this share of outbound capacity
    future_orders: 4            # future weekly POs considered when finding the next supplier delivery
    store_buffer: 1.0           # share of store target levels the DC order must leave in stores at the end of its window

stress:                         # Task 5 (see project_a/stress.py, DECISION_LOG D-27)
  dept: FOODS_3
  from_day: 14                  # test-day index: POs placed in weeks 3-5 are hit
  to_day: 35
  multiplier: 2.0
  warn_days: 14

tuning:
  n_sims: 6                     # Monte Carlo runs per knob setting per tuning cutoff
  fill_margin: 0.005            # require mean fill >= target + margin on every tuning cutoff
  penalty_per_point: 20000      # $ penalty per fill-rate point below that
  rounds: 1                     # one coordinate-descent pass (each setting = 3 cutoffs x n_sims replays)
  grid:
    beta_dc: [0.95, 0.97, 0.99, 0.995]
    alpha_store: [0.95, 0.97, 0.99]
    store_buffer: [0.5, 1.0, 1.5]
    store_window: [2, 3, 4]

simulation:
  n_sims: 100
  seed: 2026
  demand_mode: imputed          # imputed (recorded on clean days, drawn on censored days) | recorded | synthetic
  censored_inv_r: 0.3           # NB 1/r for demand drawn on censored test days (mean = imputed rate)
  lead_time_rounding: round     # supplier lead time in whole days: round(L), min 1
  lead_time_shock: null         # e.g. {dept: FOODS_3, from_day: 14, to_day: 35, multiplier: 2.0, warn_days: 14}

seed: 42
